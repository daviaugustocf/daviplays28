# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Converter partes em MP4 e salvar no repositorio
        run: |
          if [ -f iptv/video-parte-01.js ]; then
            python3 - <<'PY'
          import base64, hashlib, pathlib, re
          d=pathlib.Path('iptv')
          parts=[d / ('video-parte-%02d.js' % i) for i in range(1,16)]
          encoded=[]
          for p in parts:
              matches=re.findall(r'partesVideo\.push\("([A-Za-z0-9+/=]+)"\)',p.read_text())
              assert len(matches)==1, str(p)
              encoded.append(matches[0])
          data=base64.b64decode(''.join(encoded), validate=True)
          assert hashlib.sha256(data).hexdigest()=='c2ea652741bfa2d09adb795435458f4d6f4b736ed33bca8d23b2171eaec41ad9'
          html=(d/'index.html').read_text()
          html,n=re.subn(r'<script src="video-parte-\d+\.js"></script>', '', html)
          assert n==15, n
          assert html.count('window.PRIMEIRO_VIDEO')==3
          html=html.replace('window.PRIMEIRO_VIDEO', "'primeiro-video.mp4'")
          (d/'primeiro-video.mp4').write_bytes(data)
          (d/'index.html').write_text(html)
          PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add iptv/primeiro-video.mp4 iptv/index.html
            git rm iptv/video-parte-*.js
            git commit -m 'Usa video MP4 completo no Davi Play'
            git push origin HEAD:main
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
